name: Day One Biopharmaceuticals
description: >-
  Day One Biopharmaceuticals is a commercial-stage biopharmaceutical company developing and
  commercializing targeted therapies for people of all ages living with life-threatening diseases,
  with an initial focus on pediatric and rare cancers. Its lead product OJEMDA (tovorafenib) is an
  FDA-approved treatment for relapsed or refractory pediatric low-grade glioma, and its pipeline
  includes DAY301 and the antibody-drug conjugate Emi-Le. Headquartered in Brisbane, California, the
  company was acquired by and is now part of the Servier Group as of March 2026. Day One was surfaced
  as a portfolio company of Canaan Partners and added to the API Evangelist network; it maintains a
  corporate and investor-relations web presence but publishes no public developer API, SDK, or
  programmatic surface.
